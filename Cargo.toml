[package]
name = "sonata_launcher_core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
async-std = { version = "1.13.2", features = ["attributes", "unstable"] }
async-broadcast = "0.7.2"
serde = { version = "1.0.203", features = ["derive", "rc"] }
serde_json = { version = "1.0.143", features = ["raw_value"] }
futures = "0.3.30"
surf = "2.3.2"
chrono = { version = "0.4.38", features = ["serde"] }
home = "0.5.9"
uuid = { version = "1.11.0", features = ["v4", "v5"] }
sha1 = "0.10.6"
strum = { version = "0.27", features = ["derive"] }
ts-rs = { version = "10.1", features = ["chrono-impl", "serde-json-impl", "no-serde-warnings"] }
http-types = "2.12.0"
thiserror = "2.0.12"
getset = "0.1.6"
regex = "1.11.1"
zip-extensions = "0.8.3"
async-channel = "2.5.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-async-std"] }
serde_with = "3.14.0"
linked-hash-map = "0.5.6"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
slug = "0.1.6"
async-trait = "0.1.92"

[dev-dependencies]
httpmock = "0.7.0"
tempfile = "3.21.0"
